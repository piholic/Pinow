    var nameEl = $('ns-name'), nameEnEl = $('ns-name-en');
    var addrEl = $('ns-addr'), addrEnEl = $('ns-addr-en');
    var itemsEl = $('ns-items'), itemsEnEl = $('ns-items-en');
    if (nameEl) { nameEl.value = s ? s.ko : ''; }
    if (nameEnEl) { nameEnEl.value = s ? s.en : ''; }
    if (addrEl) { addrEl.value = s ? (s.addrKo || '') : ''; }
    if (addrEnEl) { addrEnEl.value = s ? (s.addrEn || '') : ''; }
    if (itemsEl) { itemsEl.value = s ? (s.itemsKo || []).join(', ') : ''; }
    if (itemsEnEl) { itemsEnEl.value = s ? (s.itemsEn || []).join(', ') : ''; }
    var catEl = $('ns-cat');
    if (catEl) { catEl.value = s ? s.cat : 'cafe'; }
    bindAutoTranslate('ns-name', 'ns-name-en');
    bindAutoTranslate('ns-addr', 'ns-addr-en');
    bindAutoTranslate('ns-items', 'ns-items-en');

    var liveModeBtn = $('ns-mode-live'), testModeBtn = $('ns-mode-test'), modeHint = $('ns-mode-hint');
    function setFormMode(m) {
      mode = (m === 'test') ? 'test' : 'live';
      if (liveModeBtn) { if (mode === 'live') { liveModeBtn.classList.add('is-on'); } else { liveModeBtn.classList.remove('is-on'); } }
      if (testModeBtn) {
        if (mode === 'test') { testModeBtn.classList.add('is-on'); testModeBtn.classList.add('is-test'); }
        else { testModeBtn.classList.remove('is-on'); testModeBtn.classList.remove('is-test'); }
      }
      if (modeHint) { modeHint.textContent = t(mode === 'test' ? 'mode.testHint' : 'mode.liveHint'); }
    }
    if (liveModeBtn) { liveModeBtn.onclick = function () { setFormMode('live'); }; }
    if (testModeBtn) { testModeBtn.onclick = function () { setFormMode('test'); }; }

    $('ns-submit').onclick = function () {
      var name = (nameEl && nameEl.value || '').trim();
      if (!name) { toast(t('form.needName'), 'warn'); if (nameEl) { nameEl.focus(); } return; }
      var nameEn = (nameEnEl && nameEnEl.value || '').trim() || autoTranslate(name);
      var cat = $('ns-cat').value || 'other';
      var addr = (addrEl && addrEl.value || '').trim();
      var addrEn = (addrEnEl && addrEnEl.value || '').trim() || autoTranslate(addr);
      var itemsLocal = (itemsEl && itemsEl.value || '').split(',').map(function (v) { return v.trim(); }).filter(function (v) { return !!v; });
      var itemsEn = (itemsEnEl && itemsEnEl.value || '').split(',').map(function (v) { return v.trim(); }).filter(function (v) { return !!v; });
      if (!itemsEn.length && itemsLocal.length) { itemsEn = itemsLocal.map(autoTranslate); }
      var fallbackAddr = lat.toFixed(5) + ', ' + lng.toFixed(5);

      if (s) {
        s.ko = name;
        s.en = nameEn;
        s.cat = cat;
        s.addrKo = addr || fallbackAddr;
        s.addrEn = addrEn || fallbackAddr;
        s.itemsKo = itemsLocal.length ? itemsLocal : ['—'];
        s.itemsEn = itemsEn.length ? itemsEn : s.itemsKo;
        s.mode = mode === 'test' ? 'test' : 'live';
        save();
        closeModal();
        renderAll();
        toast(t('toast.saved'), 'good');
        return;
      }

      var store = {
        id: 'store-' + Date.now(),
        ko: name, en: nameEn, cat: cat,
        locale: 'ko',
        mode: mode === 'test' ? 'test' : 'live',
        lat: lat, lng: lng,
        addrKo: addr || fallbackAddr,
        addrEn: addrEn || fallbackAddr,
        itemsKo: itemsLocal.length ? itemsLocal : ['—'],
        itemsEn: itemsEn.length ? itemsEn : (itemsLocal.length ? itemsLocal : ['—']),
        days: {}, adDays: {}, reviewDays: {},
        createdAt: state.today, sample: false
      };
      store.days[state.today] = clockNow();
      state.stores.push(store);
      state.myStoreId = store.id;
      addLog(PTS.basic, 'merchant', store, 'log.register');
      save();
      closeModal();
      renderAll();
      setTab('merchant');
      toast(t('toast.added'), 'good');
    };
  }

  /* ------------------------------------------------------ SDK 상태 */
  function openSdk() {
    var live = PiBridge.isLive();
    var stateCls = live ? 'sdk-state on' : 'sdk-state';
    var stateTxt = live ? t('sdk.live') : t('sdk.demo');
    var body = '';
    body += '<div class="sdk-row"><div class="s-main"><code>Pi.authenticate</code><p>' + esc(t('sdk.authDesc')) + '</p></div><span class="' + stateCls + '">' + esc(stateTxt) + '</span></div>';
    body += '<div class="sdk-row"><div class="s-main"><code>Pi.createPayment</code><p>' + esc(t('sdk.payDesc')) + '</p></div><span class="' + stateCls + '">' + esc(stateTxt) + '</span></div>';
    body += '<div class="sdk-row"><div class="s-main"><code>Pi.Ads.showAd</code><p>' + esc(t('sdk.adsDesc')) + '</p></div><span class="' + stateCls + '">' + esc(stateTxt) + '</span></div>';
    body += '<p class="ad-note" style="text-align:left;margin-top:10px">' + esc(t('sdk.note')) + '</p>';
    body += '<pre class="code"><span class="c">// 1) 로그인</span>\nPi.authenticate(["username","payments"], onIncomplete);\n<span class="c">// 2) 테스트넷 결제</span>\nPi.createPayment({ amount, memo, metadata }, {\n  onReadyForServerApproval,   <span class="c">// 서버 approve</span>\n  onReadyForServerCompletion, <span class="c">// 서버 complete</span>\n  onCancel, onError\n});\n<span class="c">// 3) 리워드 광고</span>\nPi.Ads.showAd("interstitial");</pre>';
    var foot = '<button class="btn btn-primary" type="button" id="sdk-close">' + esc(t('common.close')) + '</button>';
    openModal(t('sdk.title'), body, foot);
    $('sdk-close').onclick = closeModal;
  }

  /* ------------------------------------------------------ 교환/초기화 */
  function openRedeem() {
    if (state.points < REDEEM_UNIT) {
      toast(t('wallet.redeemMin', { pts: num(state.points) }), 'warn');
      return;
    }
    var body = '';
    body += '<p style="font-size:12.5px;color:#475467;line-height:1.5">' + esc(t('wallet.redeemBody')) + '</p>';
    body += '<div class="pay-amount" style="justify-content:space-between"><b style="font-size:20px;color:#3a1eb2">1,000 P</b><span style="font-size:15px">→ 1 π</span></div>';
    body += '<p class="ad-note">' + esc(t('wallet.redeemBalance', { pts: num(state.points) })) + '</p>';
    var foot = '<button class="btn btn-ghost" type="button" id="rd-cancel">' + esc(t('common.cancel')) + '</button>' +
      '<button class="btn btn-primary" type="button" id="rd-do">' + esc(t('wallet.redeemDo')) + '</button>';
    openModal(t('wallet.redeemTitle'), body, foot);
    $('rd-cancel').onclick = closeModal;
    $('rd-do').onclick = function () {
      addLog(-REDEEM_UNIT, 'system', null, 'log.exchange');
      save();
      closeModal();
      renderAll();
      toast(t('toast.redeemDone'), 'good');
    };
  }

  function openReset() {
    var body = '<p style="font-size:12.5px;color:#475467;line-height:1.5">' + esc(t('wallet.resetAsk')) + '</p>';
    var foot = '<button class="btn btn-ghost" type="button" id="rs-cancel">' + esc(t('common.cancel')) + '</button>' +
      '<button class="btn btn-primary" type="button" id="rs-do">' + esc(t('wallet.reset')) + '</button>';
    openModal(t('wallet.reset'), body, foot);
    $('rs-cancel').onclick = closeModal;
    $('rs-do').onclick = function () {
      try { localStorage.removeItem(STORE_KEY); } catch (e) { /* 무시 */ }
      state.points = 0;
      state.logs = [];
      state.piUser = null;
      state.pinFilter = 'all';
      state.today = dayStr(new Date());
      state.stores = buildStores();
      state.myStoreId = 'store-gimbap';
      closeModal();
      closeSheet();
      renderAll();
      toast(t('toast.reset'), 'good');
    };
  }

  /* ------------------------------------------------------ 데모 하루 넘기기 */
  function advanceDay() {
    var before = counts().hidden;
    state.today = addDays(state.today, 1);
    var after = counts().hidden;
    renderAll();
    var msg = t('toast.day', { date: shortDate(state.today) });
    if (after > before) { msg += ' · ' + t('toast.newHidden', { n: after - before }); }
    toast(msg, after > before ? 'warn' : 'good');
    if (state.tab === 'map' && map) { map.closePopup(); }
  }

  /* ------------------------------------------------------------ 이벤트 */
  function bindEvents() {
    $('btn-locate').onclick = function () { locate(true); };
    $('btn-locate-top').onclick = function () { locate(true); };
    $('btn-demo').onclick = advanceDay;
    $('chip-summary').onclick = openStoreList;
    $('btn-sdk-top').onclick = openSdk;
    $('btn-sdk').onclick = openSdk;
    $('btn-add-store').onclick = function () { openStoreForm(null); };
    $('btn-edit-store').onclick = function () { openStoreForm(currentStore()); };
    $('btn-redeem').onclick = openRedeem;
    $('btn-reset').onclick = openReset;
    $('btn-pi-login').onclick = signInPi;
    $('btn-checkin').onclick = function () { doCheckin(false); };
    $('btn-ad-checkin').onclick = function () { doCheckin(true); };

    $('my-store-select').onchange = function () {
      state.myStoreId = this.value;
      save();
      renderMerchant();
      renderPins();
    };

    var modeBtns = document.querySelectorAll('#mode-toggle button');
    for (var m = 0; m < modeBtns.length; m++) {
      modeBtns[m].onclick = (function (btn) {
        return function () { setStoreMode(btn.getAttribute('data-mode')); };
      })(modeBtns[m]);
    }

    var pinFilterBtns = document.querySelectorAll('#map-filters button');
    for (var q = 0; q < pinFilterBtns.length; q++) {
      pinFilterBtns[q].onclick = (function (btn) {
        return function () { setPinFilter(btn.getAttribute('data-pin-filter')); };
      })(pinFilterBtns[q]);
    }

    var tabs = document.querySelectorAll('.tabbar button');
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].onclick = (function (btn) {
        return function () { setTab(btn.getAttribute('data-tab')); };
      })(tabs[i]);
    }

    var langBtns = document.querySelectorAll('.lang button');
    for (var j = 0; j < langBtns.length; j++) {
      langBtns[j].onclick = (function (btn) {
        return function () { setLang(btn.getAttribute('data-lang')); };
      })(langBtns[j]);
    }

    var filters = document.querySelectorAll('#wallet-filters button');
    for (var k = 0; k < filters.length; k++) {
      filters[k].onclick = (function (btn) {
        return function () {
          state.filter = btn.getAttribute('data-filter');
          renderWallet();
        };
      })(filters[k]);
    }

    $('backdrop').onclick = closeSheet;
    $('modal-close').onclick = closeModal;
    $('modal').onclick = function (ev) { if (ev.target === $('modal')) { closeModal(); } };

    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape') { closeModal(); closeSheet(); }
    });

    var fb = $('fallback-list');
    if (fb) {
      fb.onclick = function (ev) {
        var el = ev.target;
        while (el && el !== fb && !el.getAttribute('data-store')) { el = el.parentNode; }
        if (el && el !== fb) { openStoreSheet(el.getAttribute('data-store')); }
      };
    }
  }

  /* -------------------------------------------------------------- 시작 */
  function init() {
    load();
    applyI18n();
    bindEvents();
    setTab('map');
    initMap();
    renderAll();
    // 첫 화면에서 바로 현재 위치를 잡아 봅니다. 실패하면 샘플 지역으로 동작합니다.
    setTimeout(function () { locate(false); }, 400);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>

</body>
</html>
