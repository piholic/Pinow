<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6b4bff">
<meta name="color-scheme" content="light">
<title>PiNow — 오늘 파이를 받는 매장 지도</title>
<meta name="description" content="PiNow: a live map of Pi merchants that checked in today. Built for the Pi Next Hackathon.">
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* ===========================================================================
   PiNow — single-file prototype for the Pi Next Hackathon
   실시간 체크인 기반 파이(Pi) 가맹점 지도 / Live check-in map of Pi merchants
   =========================================================================== */
:root{
  --pi:#6b4bff;
  --pi-2:#8b6bff;
  --pi-deep:#3f22c4;
  --pi-soft:#efeaff;
  --ink:#111827;
  --ink-2:#344054;
  --muted:#6b7280;
  --line:#e9ebf2;
  --bg:#f5f6fa;
  --green:#0e9f6e;
  --green-soft:#e7f8f1;
  --red:#e5484d;
  --red-soft:#fdeaea;
  --blue:#2563eb;
  --blue-soft:#e8efff;
  --blue-deep:#1d4ed8;
  --gray-soft:#eef0f5;
  --tabbar-h:64px;
  --shadow:0 10px 28px rgba(16,24,40,.10);
  --shadow-sm:0 4px 14px rgba(16,24,40,.08);
  --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:#e9ecf3;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
svg{display:block}
[hidden]{display:none !important}

/* ---------- app shell ---------- */
#app{
  position:relative;isolation:isolate;
  width:100%;max-width:480px;height:100vh;height:100dvh;
  margin:0 auto;overflow:hidden;background:#fff;
}
@media (min-width:560px){
  body{padding:18px 0}
  #app{height:min(920px, calc(100dvh - 36px));border-radius:30px;box-shadow:0 30px 70px rgba(16,24,40,.22)}
}

/* ---------- map ---------- */
.map-shell{position:absolute;inset:0;z-index:0;background:#e6ebf2}
#map{position:absolute;inset:0}
.leaflet-container{font:inherit;background:#e6ebf2}
.leaflet-div-icon{background:none;border:0}
.leaflet-control-attribution{font-size:9px;background:rgba(255,255,255,.78);border-radius:8px 0 0 0}
.leaflet-bottom.leaflet-left{bottom:calc(var(--tabbar-h) + 10px + env(safe-area-inset-bottom))}
.leaflet-bottom.leaflet-right{bottom:calc(var(--tabbar-h) + 4px + env(safe-area-inset-bottom))}
.leaflet-control-zoom a{color:#344054;border-radius:8px}

/* pins */
.pin-wrap{position:absolute;left:0;top:0;width:0;height:0}
.pin{
  position:absolute;left:0;top:0;transform:translate(-50%,-50%);
  width:30px;height:30px;border-radius:50%;border:2.5px solid #fff;
  box-shadow:0 4px 12px rgba(16,24,40,.30);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:800;color:#fff;background:#98a2b3;
}
.pin--green{background:var(--green)}
.pin--red{background:var(--red)}
.pin--blue{background:var(--blue)}
.pin.is-test::after{
  content:"";position:absolute;inset:-9px;border-radius:50%;
  border:2px solid rgba(37,99,235,.50);animation:pinPulse 2.2s ease-out infinite;
}
.pin.is-live::after{
  content:"";position:absolute;inset:-9px;border-radius:50%;
  border:2px solid rgba(14,159,110,.55);animation:pinPulse 2.2s ease-out infinite;
}
@keyframes pinPulse{
  0%{transform:scale(.65);opacity:.95}
  70%{transform:scale(1.28);opacity:0}
  100%{transform:scale(1.28);opacity:0}
}
.pin-label{
  position:absolute;left:0;top:16px;transform:translateX(-50%);
  display:inline-flex;align-items:center;gap:4px;
  white-space:nowrap;font-size:11px;font-weight:700;color:#1f2937;
  background:rgba(255,255,255,.96);padding:2px 7px;border-radius:8px;
  box-shadow:0 2px 8px rgba(16,24,40,.16);
}
.pin-badge{
  font-size:9px;font-weight:800;line-height:1.4;color:#fff;background:var(--blue);
  padding:0 4px;border-radius:5px;
}
.me-dot{
  position:absolute;left:0;top:0;transform:translate(-50%,-50%);
  width:18px;height:18px;border-radius:50%;background:#2f6bff;
  border:3px solid #fff;box-shadow:0 0 0 7px rgba(47,107,255,.16);
}

/* ---------- top bar ---------- */
.topbar{
  position:absolute;top:0;left:0;right:0;z-index:20;
  display:flex;align-items:center;gap:8px;
  padding:calc(9px + env(safe-area-inset-top)) 12px 9px;
  background:rgba(255,255,255,.90);backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(233,235,242,.9);
}
.brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.brand-mark{
  width:34px;height:34px;border-radius:12px;flex:0 0 auto;
  background:linear-gradient(140deg,#8b6bff,#3f22c4);
  color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;
  box-shadow:0 6px 14px rgba(107,75,255,.38);
}
.brand-text{min-width:0}
.brand-name{font-weight:800;font-size:16px;letter-spacing:-.02em;line-height:1.1}
.brand-tag{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.icon-btn{
  width:38px;height:38px;border-radius:13px;flex:0 0 auto;
  background:#f1f2f8;color:#3b4256;display:grid;place-items:center;
  transition:background .15s, color .15s;
}
.icon-btn:active{background:#e6e8f2}
.icon-btn.is-busy{color:var(--pi);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.45}}
.lang{display:flex;background:#f1f2f8;border-radius:12px;padding:2px;flex:0 0 auto}
.lang button{
  font-size:11px;font-weight:800;letter-spacing:.02em;padding:6px 7px;border-radius:10px;color:#98a2b3;
}
.lang button.is-on{background:#fff;color:var(--pi);box-shadow:0 1px 5px rgba(16,24,40,.14)}

/* ---------- map overlays ---------- */
.map-top{
  position:absolute;left:12px;right:12px;top:calc(64px + env(safe-area-inset-top));
  z-index:15;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
  pointer-events:none;
}
.map-top > *{pointer-events:auto}
.map-top-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.95);backdrop-filter:blur(8px);
  border:1px solid rgba(233,235,242,.95);border-radius:999px;
  padding:7px 11px;font-size:11.5px;font-weight:700;color:var(--ink-2);
  box-shadow:var(--shadow-sm);max-width:100%;
}
.chip .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.chip .chev{font-size:13px;color:#98a2b3;line-height:1}
.chip-summary{max-width:calc(100% - 118px);text-align:left;line-height:1.25}
.chip-sdk{padding:6px 10px;font-size:10.5px}
.dot--green{background:var(--green)}
.dot--red{background:var(--red)}
.dot--gray{background:#98a2b3}
.dot--blue{background:var(--blue)}
.demo-btn{
  display:flex;flex-direction:column;align-items:flex-start;gap:1px;
  background:#131a2b;color:#fff;border-radius:14px;padding:8px 11px;
  box-shadow:0 10px 22px rgba(19,26,43,.30);text-align:left;
}
.demo-btn:active{transform:scale(.98)}
.demo-btn small{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;opacity:.62}
.demo-btn strong{font-size:12px;font-weight:800;display:flex;align-items:center;gap:4px}

/* legend + pin filters (map top) */
.map-left{display:flex;flex-direction:column;align-items:stretch;gap:6px;max-width:calc(100% - 110px);min-width:0}
.chip-summary{max-width:100%}
.legend{
  display:flex;flex-wrap:wrap;gap:3px 9px;
  background:rgba(255,255,255,.95);backdrop-filter:blur(8px);
  border:1px solid rgba(233,235,242,.95);border-radius:12px;
  padding:6px 9px;box-shadow:var(--shadow-sm);
}
.legend-item{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.legend-item .dot{width:7px;height:7px}
.chip-filters{display:flex;flex-wrap:wrap;gap:5px}
.chip-filters button{
  font-size:10.5px;font-weight:800;padding:5px 9px;border-radius:999px;
  background:rgba(255,255,255,.95);color:#667085;
  border:1px solid rgba(233,235,242,.95);box-shadow:var(--shadow-sm);
}
.chip-filters button.is-on{background:#131a2b;color:#fff;border-color:#131a2b}

.fab{
  position:absolute;right:14px;bottom:calc(var(--tabbar-h) + 22px + env(safe-area-inset-bottom));
  z-index:15;width:46px;height:46px;border-radius:16px;
  background:#fff;color:var(--pi);display:grid;place-items:center;
  box-shadow:0 10px 26px rgba(16,24,40,.18);
}
.fab:active{transform:scale(.96)}
.fab.is-busy{color:#98a2b3}

.map-fallback{
  position:absolute;inset:0;z-index:12;overflow-y:auto;
  padding:calc(120px + env(safe-area-inset-top)) 14px calc(var(--tabbar-h) + 24px);
  background:var(--bg);
}
.map-fallback h3{font-size:14px;margin-bottom:10px;color:var(--ink-2)}
.fb-row{
  display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;
  padding:11px 12px;margin-bottom:8px;box-shadow:var(--shadow-sm);width:100%;text-align:left;
}
.fb-row .name{font-weight:700;font-size:13.5px}
.fb-row .fb-en{display:block;font-size:10px;font-weight:600;color:var(--muted);margin-top:1px}
.fb-row .meta{font-size:11px;color:var(--muted)}

/* ---------- pages ---------- */
.page{
  position:absolute;inset:0;z-index:10;background:var(--bg);overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:calc(72px + env(safe-area-inset-top)) 14px calc(var(--tabbar-h) + 26px + env(safe-area-inset-bottom));
  display:none;
}
.page.is-on{display:block}
.page-head{margin:2px 4px 14px}
.page-head h1{font-size:21px;font-weight:800;letter-spacing:-.02em}
.page-head p{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.sec-title{font-size:12px;font-weight:800;color:#7a8496;letter-spacing:.02em;margin:18px 5px 8px;text-transform:uppercase}

.card{
  background:#fff;border-radius:var(--radius);padding:15px 16px;
  box-shadow:var(--shadow-sm);border:1px solid rgba(233,235,242,.9);
  margin-bottom:11px;
}
.card h2{font-size:13.5px;font-weight:800;color:var(--ink-2)}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.card-head span{font-size:11.5px;color:var(--muted);font-weight:600}

/* ---------- merchant ---------- */
.hero{
  position:relative;overflow:hidden;
  background:linear-gradient(145deg,#150f36,#3a1eb2 58%,#6b4bff 100%);
  color:#fff;border-radius:22px;padding:16px;margin-bottom:12px;
  box-shadow:0 18px 38px rgba(58,30,178,.30);
}
.hero::after{
  content:"";position:absolute;right:-46px;top:-56px;width:180px;height:180px;
  border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.22),rgba(255,255,255,0) 70%);
}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:8px;position:relative;z-index:1}
.store-select{position:relative;display:inline-flex;align-items:center;max-width:62%}
.store-select select{
  appearance:none;-webkit-appearance:none;background:rgba(255,255,255,.14);color:#fff;
  border:1px solid rgba(255,255,255,.22);border-radius:11px;
  font-size:11.5px;font-weight:700;padding:6px 24px 6px 10px;max-width:100%;
}
.store-select::after{content:"▾";position:absolute;right:9px;font-size:10px;opacity:.7;pointer-events:none}
.store-select option{color:#111827}
.hero-name{font-size:20px;font-weight:800;letter-spacing:-.02em;margin:12px 0 3px;position:relative;z-index:1}
.hero-name-en{font-size:12.5px;font-weight:600;color:rgba(255,255,255,.76);margin-top:2px;position:relative;z-index:1}
.hero-meta{font-size:12px;opacity:.82;position:relative;z-index:1}
.hero-streak{
  display:inline-flex;align-items:center;gap:5px;margin-top:9px;
  font-size:11px;font-weight:700;background:rgba(255,255,255,.16);
  padding:4px 9px;border-radius:999px;position:relative;z-index:1;
}
.btn-checkin{
  width:100%;margin-top:14px;padding:14px;border-radius:15px;
  background:#fff;color:#3a1eb2;font-weight:800;font-size:15px;
  display:flex;align-items:center;justify-content:center;gap:7px;
  box-shadow:0 8px 20px rgba(9,6,32,.35);position:relative;z-index:1;
}
.btn-checkin:disabled{background:rgba(255,255,255,.18);color:rgba(255,255,255,.72);box-shadow:none}
.btn-ad{
  width:100%;margin-top:8px;padding:12px;border-radius:15px;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);color:#fff;
  font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px;
  position:relative;z-index:1;
}
.btn-ad:disabled{opacity:.55}
.btn-ad b{background:#ffd66b;color:#3a2a00;border-radius:7px;padding:1px 5px;font-size:10.5px}

/* participation type — live merchant / test store */
.mode-seg{display:inline-flex;background:#f1f2f8;border-radius:11px;padding:2px;gap:2px}
.mode-seg button{font-size:11px;font-weight:800;padding:6px 11px;border-radius:9px;color:#98a2b3;white-space:nowrap}
.mode-seg button.is-on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(16,24,40,.16)}
.mode-seg button.is-test.is-on{background:var(--blue-soft);color:var(--blue-deep)}
.hero .mode-seg{background:rgba(255,255,255,.16);margin-top:12px;position:relative;z-index:1;width:100%}
.hero .mode-seg button{flex:1;color:rgba(255,255,255,.72)}
.hero .mode-seg button.is-on{background:#fff;color:#3a1eb2;box-shadow:none}
.hero .mode-seg button.is-test.is-on{background:var(--blue);color:#fff}
.mode-badge{
  display:inline-flex;align-items:center;gap:5px;margin-top:11px;
  font-size:10.5px;font-weight:800;padding:5px 9px;border-radius:999px;
}
.mode-badge--live{background:var(--gray-soft);color:#475467}
.mode-badge--test{background:var(--blue-soft);color:var(--blue-deep)}
.mode-hint{font-size:10.5px;color:var(--muted);margin-top:6px;line-height:1.45}
.s-tag{font-size:9.5px;font-weight:800;color:var(--blue-deep);background:var(--blue-soft);padding:1px 5px;border-radius:5px;margin-left:5px}

/* bilingual: local language + auto English translation */
.bi-row{display:flex;gap:8px}
.bi-row .field{flex:1;min-width:0;margin-bottom:11px}
.bi-note{font-size:10.5px;color:var(--muted);line-height:1.45;margin:-1px 0 10px}
.bi-note b{color:var(--blue-deep);font-weight:800}
.field input.is-auto{background:#f7f9ff;border-color:#dbe4ff}

.week{display:flex;gap:5px}
.wday{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;border-radius:12px}
.wday.is-today{background:var(--pi-soft)}
.wday-l{font-size:10px;color:#98a2b3;font-weight:700}
.wday-d{
  width:24px;height:24px;border-radius:50%;display:grid;place-items:center;
  font-size:12px;font-weight:800;background:var(--gray-soft);color:#c3c8d4;
}
.wday-d.on{background:var(--green);color:#fff}
.wday.is-today .wday-d.on{box-shadow:0 0 0 3px rgba(14,159,110,.18)}
.wday-n{font-size:9.5px;color:#98a2b3}

.rule{display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:12.5px;color:var(--ink-2)}
.rule .dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:0 0 auto}
.rule b{font-weight:700}
.rule .hint{display:block;font-size:11px;color:var(--muted);margin-top:1px}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:13px 16px;border-radius:14px;font-weight:800;font-size:14px;
  transition:transform .12s, background .15s;
}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--pi);color:#fff;box-shadow:0 8px 20px rgba(107,75,255,.34);flex:1}
.btn-primary:disabled{background:#c9c3e8;box-shadow:none}
.btn-ghost{background:#f1f2f8;color:#475467;flex:0 0 auto}
.btn-outline{
  width:100%;padding:14px;border-radius:15px;border:1.5px dashed #cfd3e0;background:#fff;
  color:var(--pi);font-weight:800;font-size:13.5px;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.btn-outline + .btn-outline{margin-top:8px}
.btn-ghost-danger{
  width:100%;padding:12px;border-radius:14px;color:#b42318;font-size:12.5px;font-weight:700;
  background:#fdf2f1;margin-top:6px;
}
.wide{width:100%}
.btn-mini{
  flex:0 0 auto;padding:8px 12px;border-radius:10px;background:var(--pi);color:#fff;
  font-size:11.5px;font-weight:800;
}
.btn-mini:disabled{background:#e4e0f7;color:#7a6bb0}

/* ---------- wallet ---------- */
.balance{background:linear-gradient(150deg,#f6f3ff,#e9e2ff);border:1px solid #ded4ff}
.balance-label{font-size:12px;font-weight:700;color:#6b5aa8}
.balance-num{display:flex;align-items:baseline;gap:4px;margin:2px 0 6px}
.balance-num b{font-size:34px;font-weight:800;letter-spacing:-.03em;color:#3a1eb2;line-height:1.1}
.balance-num span{font-size:14px;font-weight:800;color:#6b5aa8}
.balance-split{display:flex;gap:14px;margin:8px 0 13px}
.balance-split div{display:flex;flex-direction:column;gap:1px}
.balance-split span{font-size:10.5px;color:#7a6bb0;font-weight:600}
.balance-split b{font-size:13px;color:#3a1eb2}
.btn-redeem{
  width:100%;padding:12px;border-radius:13px;background:#3a1eb2;color:#fff;
  font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px;
}
.rate{font-size:10.5px;color:#7a6bb0;text-align:center;margin-top:7px}

.filters{display:flex;gap:6px;margin-bottom:4px}
.filters button{
  font-size:11.5px;font-weight:700;padding:6px 11px;border-radius:999px;
  background:#f1f2f8;color:#6b7280;
}
.filters button.is-on{background:var(--ink);color:#fff}
.log-list{min-height:40px}
.log{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f1f2f7}
.log:last-child{border-bottom:0}
.log-ico{
  width:34px;height:34px;border-radius:11px;flex:0 0 auto;display:grid;place-items:center;
  background:var(--pi-soft);color:var(--pi);
}
.log-ico.visitor{background:#e8f1ff;color:#2f6bff}
.log-ico.minus{background:#fdeaea;color:var(--red)}
.log-main{flex:1;min-width:0}
.log-title{font-size:12.5px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log-sub{font-size:10.5px;color:var(--muted);margin-top:1px}
.log-pts{font-size:13px;font-weight:800;color:var(--green);flex:0 0 auto}
.log-pts.minus{color:var(--red)}
.empty{padding:18px 6px;text-align:center;font-size:12px;color:var(--muted);line-height:1.5}

.program{display:flex;gap:11px;align-items:flex-start}
.program .pico{
  width:36px;height:36px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;
  background:linear-gradient(140deg,#8b6bff,#3f22c4);color:#fff;font-weight:800;font-size:13px;
}
.program h3{font-size:13px;font-weight:800;margin-bottom:3px}
.program p{font-size:11.5px;color:var(--muted);line-height:1.45}
.program .tagline{display:inline-block;margin-top:6px;font-size:10px;font-weight:800;color:var(--pi);background:var(--pi-soft);padding:2px 7px;border-radius:6px}

/* ---------- tab bar ---------- */
.tabbar{
  position:absolute;left:0;right:0;bottom:0;z-index:25;
  height:calc(var(--tabbar-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  display:flex;background:rgba(255,255,255,.97);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
}
.tabbar button{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:10.5px;font-weight:700;color:#98a2b3;transition:color .15s;
}
.tabbar button.is-on{color:var(--pi)}
.tabbar button.is-on svg{transform:translateY(-1px)}
.tabbar svg{transition:transform .18s}

/* ---------- sheet ---------- */
.backdrop{
  position:absolute;inset:0;z-index:1000;background:rgba(16,24,40,.44);
  opacity:0;pointer-events:none;transition:opacity .22s;
}
.backdrop.is-on{opacity:1;pointer-events:auto}
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:1010;
  background:#fff;border-radius:24px 24px 0 0;max-height:88%;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  transform:translateY(103%);transition:transform .28s cubic-bezier(.3,.85,.3,1);
  padding:6px 16px calc(20px + env(safe-area-inset-bottom));
  box-shadow:0 -14px 44px rgba(16,24,40,.20);
}
.sheet.is-on{transform:translateY(0)}
.grabber{width:40px;height:4px;border-radius:2px;background:#e3e6ee;margin:6px auto 12px}

.sheet-store{display:flex;align-items:center;gap:11px}
.sheet-cat{
  width:44px;height:44px;border-radius:14px;flex:0 0 auto;display:grid;place-items:center;
  background:var(--pi-soft);color:var(--pi);
}
.sheet-store-main{flex:1;min-width:0}
.sheet-store-main h2{font-size:17px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-name-en{font-size:12px;font-weight:600;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-addr-en{font-size:10.5px;color:#98a2b3;margin-top:2px}
.sheet-sub{font-size:11px;color:var(--muted);margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;padding:5px 9px;border-radius:999px;flex:0 0 auto}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill--green{background:var(--green-soft);color:#08704f}
.pill--red{background:var(--red-soft);color:#b42318}
.pill--hidden{background:var(--gray-soft);color:#667085}
.sheet-status{
  display:flex;align-items:center;gap:8px;margin-top:14px;padding:11px 13px;border-radius:14px;
  font-size:12.5px;font-weight:700;
}
.sheet-status.green{background:var(--green-soft);color:#08704f}
.sheet-status.red{background:var(--red-soft);color:#b42318}
.sheet-status.hidden{background:var(--gray-soft);color:#475467}
.sheet-note{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5}
.sheet-meta{display:flex;gap:16px;margin-top:12px;font-size:11.5px;color:var(--muted)}
.sheet-meta b{color:var(--ink-2);font-weight:700}
.items{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.item-tag{font-size:11px;font-weight:600;background:#f4f5fa;color:#475467;padding:4px 9px;border-radius:8px}
.item-tag b{font-weight:700;color:var(--ink-2)}
.item-tag em{font-style:normal;font-weight:600;color:#98a2b3;margin-left:3px}
.sheet-actions{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.sheet-actions .btn{width:100%}
.btn-pay{background:linear-gradient(135deg,#7c5cff,#4b2fd6);color:#fff;box-shadow:0 10px 22px rgba(107,75,255,.32)}
.btn-review{background:#f4f5fa;color:#344054;border:1px solid var(--line)}
.btn-owner{background:none;color:var(--pi);font-size:11.5px;font-weight:700;padding:6px}
.empty-state{padding:30px 10px;text-align:center;color:var(--muted);font-size:12.5px}

/* list rows inside sheet */
.srow{display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:1px solid #f1f2f7;width:100%;text-align:left}
.srow:last-child{border-bottom:0}
.srow .s-ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--pi-soft);color:var(--pi);flex:0 0 auto}
.srow .s-main{flex:1;min-width:0}
.srow .s-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .s-name-en{display:block;font-size:10px;font-weight:600;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .s-sub{font-size:10.5px;color:var(--muted);margin-top:1px}
.srow .s-dist{font-size:10.5px;color:#98a2b3;font-weight:700;flex:0 0 auto}
.srow.is-hidden{opacity:.65}
.list-head{font-size:11px;font-weight:800;color:#7a8496;margin:16px 2px 2px;text-transform:uppercase;letter-spacing:.02em}
.list-head .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin:0 3px 0 2px;vertical-align:middle}
.sample-note{font-size:10.5px;color:var(--muted);margin-top:10px;line-height:1.45}

/* ---------- modal ---------- */
.modal{
  position:absolute;inset:0;z-index:1100;display:none;align-items:center;justify-content:center;
  padding:16px;background:rgba(16,24,40,.52);
}
.modal.is-on{display:flex}
.modal-card{
  width:100%;max-width:400px;background:#fff;border-radius:22px;padding:17px;
  box-shadow:0 26px 60px rgba(16,24,40,.32);max-height:88%;overflow-y:auto;
  animation:modalIn .22s ease-out;
}
@keyframes modalIn{from{transform:translateY(10px) scale(.98);opacity:.6}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.modal-head h2{font-size:16px;font-weight:800;letter-spacing:-.01em}
.modal-x{width:30px;height:30px;border-radius:10px;background:#f1f2f8;color:#667085;font-size:17px;line-height:1;display:grid;place-items:center}
.modal-foot{display:flex;gap:8px;margin-top:16px}
.modal-foot .btn{flex:1}
.modal-foot .btn-ghost{flex:0 0 auto}

.field{display:block;margin-bottom:11px}
.field > span{display:block;font-size:11.5px;font-weight:700;color:var(--ink-2);margin-bottom:5px}
.field input[type=text],.field input[type=number],.field select,.field textarea{
  width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fbfbfe;
  font-size:13.5px;outline:none;transition:border-color .15s,background .15s;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--pi);background:#fff}
.field textarea{resize:vertical;min-height:64px}
.field-row{display:flex;gap:8px}
.field-row .field{flex:1;margin-bottom:11px}

/* ad */
.ad-box{margin-bottom:4px}
.ad-frame{
  position:relative;height:150px;border-radius:16px;overflow:hidden;
  background:linear-gradient(135deg,#1c1440,#4b2fd6 60%,#8b6bff);
  color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
}
.ad-frame::before{
  content:"";position:absolute;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.22),transparent 65%);top:-80px;right:-60px;
}
.ad-frame p{font-size:19px;font-weight:800;letter-spacing:-.02em}
.ad-frame small{font-size:10.5px;opacity:.72}
.ad-tag{position:absolute;top:9px;left:9px;font-size:9px;font-weight:800;letter-spacing:.08em;background:rgba(255,255,255,.22);padding:2px 6px;border-radius:5px}
.progress{height:6px;border-radius:3px;background:#eceef5;overflow:hidden;margin:12px 0 7px}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8b6bff,#4b2fd6);transition:width .9s linear}
.ad-count{font-size:12px;font-weight:700;color:var(--ink-2);text-align:center}
.ad-count.done{color:var(--green)}
.ad-note{font-size:10.5px;color:var(--muted);text-align:center;margin-top:8px;line-height:1.45}

/* payment */
.pay-head{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:12px}
.pay-amount{display:flex;align-items:center;gap:8px;background:#f7f5ff;border:1.5px solid #e0d8ff;border-radius:14px;padding:10px 12px;margin-bottom:11px}
.pay-amount input{flex:1;border:0;background:none;font-size:22px;font-weight:800;color:#3a1eb2;outline:none;width:100%}
.pay-amount span{font-size:18px;font-weight:800;color:#7a6bb0}
.steps{list-style:none;padding:0;margin:12px 0 0}
.steps li{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:12px;color:#98a2b3;font-weight:600}
.steps li .sdot{width:16px;height:16px;border-radius:50%;border:2px solid #e3e6ee;flex:0 0 auto;display:grid;place-items:center;font-size:9px;color:#fff}
.steps li.run{color:var(--ink-2)}
.steps li.run .sdot{border-color:var(--pi);border-top-color:transparent;animation:spin .7s linear infinite}
.steps li.ok{color:#08704f}
.steps li.ok .sdot{background:var(--green);border-color:var(--green)}
.steps li.ok .sdot::after{content:"✓"}
.steps li.warn{color:#b42318}
.steps li.warn .sdot{background:var(--red);border-color:var(--red)}
.steps li.warn .sdot::after{content:"!"}
@keyframes spin{to{transform:rotate(360deg)}}
.receipt{background:#f7fdfa;border:1px dashed #b7e4cf;border-radius:14px;padding:11px 13px;margin-top:12px;font-size:11.5px;color:#08704f}
.receipt b{display:block;font-size:13px;margin-bottom:4px}
.receipt code{font-size:10.5px;word-break:break-all;color:#0b6e4f}

/* review stars */
.stars{display:flex;gap:6px;margin:2px 0 12px}
.stars button{font-size:26px;line-height:1;color:#d8dbe4;transition:transform .1s,color .1s}
.stars button.on{color:#f5a623}
.stars button:active{transform:scale(1.12)}
.review-store{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-bottom:10px}

/* sdk */
.sdk-row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid #f1f2f7}
.sdk-row:last-of-type{border-bottom:0}
.sdk-row .s-main{flex:1;min-width:0}
.sdk-row code{font-size:11px;font-weight:700;color:#3a1eb2;background:#f6f3ff;padding:1px 5px;border-radius:5px}
.sdk-row p{font-size:10.5px;color:var(--muted);margin-top:3px}
.sdk-state{font-size:9.5px;font-weight:800;padding:3px 7px;border-radius:999px;background:var(--gray-soft);color:#667085;flex:0 0 auto}
.sdk-state.on{background:var(--green-soft);color:#08704f}
pre.code{
  background:#131a2b;color:#d7dcf5;border-radius:12px;padding:11px;font-size:10px;line-height:1.5;
  overflow-x:auto;margin:10px 0 0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}
pre.code .c{color:#7f8bb3}

/* toast */
.toast{
  position:absolute;left:50%;bottom:calc(var(--tabbar-h) + 26px + env(safe-area-inset-bottom));
  transform:translate(-50%,10px);z-index:1200;
  background:#131a2b;color:#fff;font-size:12.5px;font-weight:700;
  padding:10px 16px;border-radius:999px;max-width:88%;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .22s, transform .22s;
  box-shadow:0 12px 30px rgba(16,24,40,.28);
}
.toast.is-on{opacity:1;transform:translate(-50%,0)}
.toast.good{background:#0b7a58}
.toast.warn{background:#8a2c2c}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
}
</style>
</head>
<body>
<div id="app">

  <!-- ================= MAP ================= -->
  <div class="map-shell">
    <div id="map" role="application" aria-label="PiNow merchant map"></div>
  </div>

  <div id="map-fallback" class="map-fallback" hidden>

      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>

  <!-- map overlays -->

      <div id="map-legend" class="legend" role="list" aria-label="Pin color legend">

          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </strong>

        <span class="dot dot--green" id="sdk-dot"></span><span id="sdk-chip-text">Pi SDK</span>
      </button>

  </div>

  <button id="btn-locate" class="fab" type="button" aria-label="My location" title="내 위치 / My location">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>
  </button>

  <!-- ================= MERCHANT ================= -->
  <main id="page-merchant" class="page">
    <div class="page-head">
      <h1 data-i18n="merchant.title"></h1>
      <p data-i18n="merchant.sub"></p>
    </div>

    <section class="hero">
      <div class="hero-top">
        <label class="store-select">
          <select id="my-store-select" aria-label="My store"></select>
        </label>
        <span id="my-store-status" class="pill pill--green"><i></i><span></span></span>
      </div>
      <div class="hero-name" id="hero-name">—</div>
      <div class="hero-name-en" id="hero-name-en"></div>

        <button type="button" data-mode="test" data-i18n="mode.testShort"></button>
      </div>
      <button id="btn-checkin" class="btn-checkin" type="button"></button>
      <button id="btn-ad-checkin" class="btn-ad" type="button"></button>
    </section>

    <section class="card">
      <div class="card-head">
        <h2 data-i18n="merchant.week"></h2>
        <span id="week-streak"></span>
      </div>
      <div class="week" id="week-strip"></div>

    <section class="card">
      <h2 data-i18n="merchant.rulesTitle"></h2>

      <div class="rule"><i class="dot dot--red"></i><span><b data-i18n="merchant.rule2"></b><span class="hint" data-i18n="merchant.rule2h"></span></span></div>
      <div class="rule"><i class="dot dot--blue"></i><span><b data-i18n="merchant.ruleTest"></b><span class="hint" data-i18n="merchant.ruleTestH"></span></span></div>
      <div class="rule"><i class="dot dot--gray"></i><span><b data-i18n="merchant.rule3"></b><span class="hint" data-i18n="merchant.rule3h"></span></span></div>
      <div class="rule"><i class="dot" style="background:#c3c8d4"></i><span><b data-i18n="merchant.rule4"></b><span class="hint" data-i18n="merchant.rule4h"></span></span></div>

    <button id="btn-edit-store" class="btn-outline" type="button">✎&nbsp;<span data-i18n="form.edit"></span></button>
    <button id="btn-add-store" class="btn-outline" type="button">＋&nbsp;<span data-i18n="merchant.add"></span></button>

        <button type="button" data-filter="visitor" data-i18n="wallet.filterVisitor"></button>

          <p data-i18n="wallet.growthBody"></p>

    <button id="btn-sdk" class="btn-outline" type="button">⚙&nbsp;<span data-i18n="wallet.sdk"></span></button>

  </main>

  <!-- ================= TAB BAR ================= -->
  <nav class="tabbar" aria-label="Main">
    <button type="button" data-tab="map" class="is-on" aria-current="page">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-10.1A6.5 6.5 0 0112 4.4a6.5 6.5 0 016.5 6.5C18.5 15.4 12 21 12 21z"/><circle cx="12" cy="10.6" r="2.3"/></svg>
      <span data-i18n="tab.map"></span>

  var lang = 'ko';

  function t(key, vars) {
    var dict = I18N[lang] || I18N.ko;
    var s = dict[key];
    if (s === undefined) { s = I18N.ko[key]; }
    if (s === undefined) { return key; }
    return s.replace(/\{(\w+)\}/g, function (m, k) {
      return (vars && vars[k] !== undefined) ? String(vars[k]) : m;
    });
  }

  /* ---------------------------------------------------------------- 유틸 */
  function $(id) { return document.getElementById(id); }

  function esc(v) {
    return String(v === null || v === undefined ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function dayStr(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function parseDay(s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function addDays(s, n) { var d = parseDay(s); d.setDate(d.getDate() + n); return dayStr(d); }
  function diffDays(a, b) { return Math.round((parseDay(b).getTime() - parseDay(a).getTime()) / 86400000); }
  function clockNow() { var d = new Date(); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
  function shortDate(s) { var p = String(s).split('-'); return (+p[1]) + '/' + (+p[2]); }
  function num(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

     실제 서비스에서는 아래 한 함수만 번역 API 호출로 바꾸면 됩니다.

  var AUTO_DICT = {

  function translateWords(seg) {
    var words = String(seg).split(/\s+/).filter(function (w) { return !!w; });
    return words.map(function (w) {
      if (AUTO_DICT[w] !== undefined) { return AUTO_DICT[w]; }
      var bare = w.replace(/(에서|으로|로|의|에|은|는|이|가)$/, '');
      if (bare && AUTO_DICT[bare] !== undefined) { return AUTO_DICT[bare]; }
      return w;   // 사전에 없는 말은 그대로 두고 점주가 다듬습니다
    }).join(' ');
  }

  function autoTranslate(text) {
    var raw = String(text === undefined || text === null ? '' : text).trim();
    if (!raw) { return ''; }
    if (!/[\u3131-\uD7A3]/.test(raw)) { return raw; }   // 이미 로마자면 그대로
    return raw.split(/\s*,\s*/).map(function (seg) {
      var out = translateWords(seg);
      return out.charAt(0).toUpperCase() + out.slice(1);
    }).join(', ');
  }

  /* 현지어 칸에 입력하면 영어 칸을 자동으로 채웁니다 (직접 수정하면 그 값을 유지). */
  function bindAutoTranslate(fromId, toId) {
    var from = $(fromId), to = $(toId);
    if (!from || !to) { return; }
    function run() {
      to.value = autoTranslate(from.value);
      to.classList.add('is-auto');
    }
    from.oninput = run;
    from.onchange = run;
  }

  function distM(a, b) {
    var R = 6371000;
    var t1 = a.lat * Math.PI / 180, t2 = b.lat * Math.PI / 180;
    var dp = (b.lat - a.lat) * Math.PI / 180, dl = (b.lng - a.lng) * Math.PI / 180;
    var x = Math.sin(dp / 2) * Math.sin(dp / 2) + Math.cos(t1) * Math.cos(t2) * Math.sin(dl / 2) * Math.sin(dl / 2);
    return Math.round(2 * R * Math.asin(Math.sqrt(x)));
  }

  function distLabel(m) {
    if (m < 1000) { return t('unit.m', { n: m }); }
    return t('unit.km', { n: (m / 1000).toFixed(1) });
  }

  function weekdayShort(dayString) {
    var idx = parseDay(dayString).getDay();
    var ko = ['일', '월', '화', '수', '목', '금', '토'];
    var en = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
    return (lang === 'ko' ? ko : en)[idx];
  }

  /* ------------------------------------------------------ Pi SDK 브리지 */
  /* 파이 브라우저에서만 window.Pi가 존재합니다. 모든 호출은 이 객체를 통해서만
     일어나므로, 실제 SDK로 전환할 때 이 부분만 손보면 됩니다.               */
  var PiBridge = (function () {
    var hasPi = (typeof window.Pi !== 'undefined');
    var mode = hasPi ? 'pi' : 'demo';

    function demoDelay(step, ms) {
      return new Promise(function (resolve) { setTimeout(function () { resolve(step); }, ms); });
    }

    return {
      mode: mode,
      isLive: function () { return mode === 'pi'; },

      /* 1) Pi 로그인 ----------------------------------------------------- */
      /* Pi.authenticate(['username','payments'], onIncompletePaymentFound)  */
      authenticate: function () {
        if (!hasPi) {
          return Promise.resolve({ demo: true, user: { uid: 'demo-uid', username: 'pinow_pioneer' } });
        }
        return window.Pi.authenticate(['username', 'payments'], function (payment) {
          // 미완료 결제가 있으면 서버에서 정리해야 합니다 (아래 createPayment 주석 참고)
          console.warn('[PiNow] incomplete payment found', payment);
        });
      },

      /* 2) 테스트넷 결제 ------------------------------------------------- */
      /* 실제 서비스에서는 onReadyForServerApproval 시점에 서버가
         POST https://api.minepi.com/v2/payments/{paymentId}/approve 를 호출하고,
         onReadyForServerCompletion 시점에 /complete 를 호출해야 합니다.
         이 프로토타입에는 서버가 없으므로 데모 모드에서 단계만 시뮬레이션합니다. */
      pay: function (opts, onStep) {
        if (!hasPi) {
          return demoDelay(1, 450).then(function () {
            onStep('request');
            return demoDelay(1, 850);
          }).then(function () {
            onStep('approve');
            return demoDelay(1, 850);
          }).then(function () {
            onStep('complete');
            return { demo: true, txid: 'DEMO-' + Date.now().toString(36).toUpperCase() };
          });
        }
        return new Promise(function (resolve, reject) {
          window.Pi.createPayment({
            amount: String(opts.amount),
            memo: opts.memo,
            metadata: opts.metadata || {}
          }, {
            onReadyForServerApproval: function (paymentId) {
              onStep('request');
              // TODO(server): POST /api/payments/approve { paymentId }
              console.log('[PiNow] ready for server approval', paymentId);
            },
            onReadyForServerCompletion: function (paymentId, txid) {
              onStep('approve');
              onStep('complete');
              resolve({ paymentId: paymentId, txid: txid });
            },
            onCancel: function (paymentId) { reject(new Error('cancel:' + paymentId)); },
            onError: function (err) { reject(err); }
          });
        });
      },

      /* 3) 리워드 광고 --------------------------------------------------- */
      /* Pi.Ads.showAd('interstitial') — 광고 시청 자체는 SDK가 처리하고,
         보상 지급은 서버 검증 후 처리하는 것이 안전합니다.               */
      showAd: function () {
        if (hasPi && window.Pi && window.Pi.Ads && typeof window.Pi.Ads.showAd === 'function') {
          return window.Pi.Ads.showAd('interstitial');
        }
        return Promise.reject(new Error('demo-ad'));
      }
    };
  })();

  function storeAddr(s) { return lang === 'ko' ? s.addrKo : s.addrEn; }
  function storeItems(s) { return (lang === 'ko' ? s.itemsKo : s.itemsEn) || []; }
  /* 화면에 함께 보여 줄 다른 언어 표기 (현지어 ↔ 영어) */
  function storeNameAlt(s) {
    var alt = lang === 'ko' ? s.en : s.ko;
    return (alt && alt !== storeName(s)) ? alt : '';
  }
  function storeAddrAlt(s) {
    var alt = lang === 'ko' ? s.addrEn : s.addrKo;
    return (alt && alt !== storeAddr(s)) ? alt : '';
  }
  function itemPairs(s) {
    var a = s.itemsKo || [], b = s.itemsEn || [], out = [];
    var n = Math.max(a.length, b.length);
    for (var i = 0; i < n; i++) { out.push({ local: a[i] || '', en: b[i] || '' }); }
    return out;
  }
  function byId(id) {
    for (var i = 0; i < state.stores.length; i++) { if (state.stores[i].id === id) { return state.stores[i]; } }
    return null;
  }
  function currentStore() { return byId(state.myStoreId) || state.stores[0]; }

  function buildStores() {
    return SEEDS.map(function (seed) {
      var days = {};
      var oldest = 0;
      (seed.history || []).forEach(function (off) {
        days[addDays(state.today, -off)] = (seed.times && seed.times[0]) || '09:00';
        if (off > oldest) { oldest = off; }
      });
      return {
        id: seed.id, ko: seed.ko, en: seed.en, cat: seed.cat,
        locale: 'ko',
        mode: seed.mode === 'test' ? 'test' : 'live',
        lat: seed.lat, lng: seed.lng, addrKo: seed.addrKo, addrEn: seed.addrEn,
        itemsKo: seed.itemsKo, itemsEn: seed.itemsEn,
        days: days, adDays: {}, reviewDays: {},
        createdAt: addDays(state.today, -(oldest + 1)),
        sample: true
      };
    });
  }

  function load() {
    state.stores = buildStores();
    var raw = null;
    try { raw = localStorage.getItem(STORE_KEY); } catch (e) { raw = null; }
    if (!raw) { return; }
    try {
      var saved = JSON.parse(raw);
      if (saved && saved.stores && saved.stores.length) {
        state.stores = saved.stores;
        state.points = saved.points || 0;
        state.logs = saved.logs || [];
        state.myStoreId = saved.myStoreId || state.myStoreId;
        state.piUser = saved.piUser || null;
      }
      if (saved && saved.lang && I18N[saved.lang]) { lang = saved.lang; }
    } catch (e2) { /* 저장값이 깨졌으면 시드로 시작 */ }
  }

  function save() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        points: state.points, logs: state.logs, stores: state.stores,
        myStoreId: state.myStoreId, lang: lang, piUser: state.piUser
      }));
    } catch (e) { /* file:// 나 시크릿 모드에서는 저장을 건너뜁니다 */ }
  }

  /* -------------------------------------------------- 체크인 상태 계산 */
  function lastCheckinOffset(s) {
    var keys = Object.keys(s.days || {});
    if (!keys.length) { return null; }
    var min = 100000;
    for (var i = 0; i < keys.length; i++) {
      var n = diffDays(keys[i], state.today);
      if (n < min) { min = n; }
    }
    return min;
  }

  function statusOf(s) {
    var off = lastCheckinOffset(s);
    if (off === null) {
      var age = s.createdAt ? diffDays(s.createdAt, state.today) : 0;
      return age >= HIDE_DAYS ? 'hidden' : 'red';
    }
    if (off >= HIDE_DAYS) { return 'hidden'; }
    if (off === 0) { return 'green'; }
    return 'red';
  }

  function streakOf(s) {
    var n = 0, d = state.today;
    while (s.days && s.days[d]) { n++; d = addDays(d, -1); }
    return n;
  }

  function counts() {
    var c = { green: 0, red: 0, hidden: 0, test: 0 };
    state.stores.forEach(function (s) {
      var st = statusOf(s);
      if (st === 'hidden') { c.hidden++; return; }
      if (s.mode === 'test') { c.test++; return; }
      if (st === 'green') { c.green++; } else { c.red++; }
    });
    return c;
  }

  /* 참여 유형: live = 실제 참여 매장, test = 테스트 참여 매장(파란 핀) */
  function isTest(s) { return !!s && s.mode === 'test'; }

  function matchesFilter(s) {
    if (state.pinFilter === 'all') { return true; }
    if (statusOf(s) === 'hidden') { return false; }
    if (state.pinFilter === 'test') { return isTest(s); }
    if (isTest(s)) { return false; }
    return statusOf(s) === state.pinFilter;
  }

  function distanceTo(s) { return distM(userLoc, s); }

  function sortedStores(includeHidden) {
    return state.stores.slice()
      .filter(function (s) { return includeHidden || statusOf(s) !== 'hidden'; })
      .sort(function (a, b) { return distanceTo(a) - distanceTo(b); });
  }

  function addLog(pts, role, store, key) {
    var d = new Date();
    state.logs.unshift({
      ts: d.getTime(),
      day: state.today,
      time: pad2(d.getHours()) + ':' + pad2(d.getMinutes()),
      pts: pts, role: role, storeId: store ? store.id : null, key: key
    });
    state.points += pts;
    if (state.points < 0) { state.points = 0; }
  }

  /* ------------------------------------------------------------ 아이콘 */
  var ICON = {
    store: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5V20h16V9.5"/><path d="M3 9.5L5 4h14l2 5.5a3 3 0 01-6 0 3 3 0 01-6 0 3 3 0 01-6 0z"/><path d="M9.5 20v-5h5v5"/></svg>',
    user: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20a7.5 7.5 0 0115 0"/></svg>',
    check: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
    play: '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>'
  };

  var CAT_EMOJI = { cafe: '☕', electronics: '🔌', restaurant: '🍚', convenience: '🏪', seafood: '🐟', bakery: '🥐', salon: '✂️', other: '🏬' };
  function catEmoji(cat) { return CAT_EMOJI[cat] || '🏬'; }

  /* ------------------------------------------------------------ 토스트 */
  var toastTimer = null;
  function toast(msg, kind) {
    var el = $('toast');
    if (!el) { return; }
    el.textContent = msg;
    el.className = 'toast is-on' + (kind ? ' ' + kind : '');
    if (toastTimer) { clearTimeout(toastTimer); }
    toastTimer = setTimeout(function () { el.className = 'toast'; }, 2300);
  }

  /* ------------------------------------------------------- 다국어 적용 */
  function applyI18n() {
    document.documentElement.lang = lang;
    var i, nodes;
    nodes = document.querySelectorAll('[data-i18n]');
    for (i = 0; i < nodes.length; i++) {
      nodes[i].textContent = t(nodes[i].getAttribute('data-i18n'));
    }
    nodes = document.querySelectorAll('[data-i18n-ph]');
    for (i = 0; i < nodes.length; i++) {
      nodes[i].setAttribute('placeholder', t(nodes[i].getAttribute('data-i18n-ph')));
    }
    nodes = document.querySelectorAll('[data-i18n-aria]');
    for (i = 0; i < nodes.length; i++) {
      nodes[i].setAttribute('aria-label', t(nodes[i].getAttribute('data-i18n-aria')));
    }
    nodes = document.querySelectorAll('.lang button');
    for (i = 0; i < nodes.length; i++) {
      var on = nodes[i].getAttribute('data-lang') === lang;
      if (on) { nodes[i].classList.add('is-on'); } else { nodes[i].classList.remove('is-on'); }
    }
  }

  /* ------------------------------------------------------------ 지도 */
  var map = null, pinLayer = null, meMarker = null, radiusCircle = null;

  function initMap() {
    if (typeof L === 'undefined') {
      $('map-fallback').hidden = false;
      renderFallbackList();
      return;
    }
    try {
      map = L.map('map', { zoomControl: false, attributionControl: true })
        .setView([userLoc.lat, userLoc.lng], START_ZOOM);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19, minZoom: 10, attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);
      L.control.zoom({ position: 'bottomleft' }).addTo(map);
      pinLayer = L.layerGroup().addTo(map);
    } catch (e) {
      $('map-fallback').hidden = false;
      renderFallbackList();
      return;
    }
    drawMe();
    renderPins();
  }

  function drawMe() {
    if (!map) { return; }
    if (radiusCircle) { map.removeLayer(radiusCircle); radiusCircle = null; }
    if (meMarker) { map.removeLayer(meMarker); meMarker = null; }
    radiusCircle = L.circle([userLoc.lat, userLoc.lng], {
      radius: RADIUS_M, color: '#6b4bff', weight: 1, opacity: 0.35,
      fillColor: '#6b4bff', fillOpacity: 0.06, interactive: false
    }).addTo(map);
    meMarker = L.marker([userLoc.lat, userLoc.lng], {
      interactive: false, keyboard: false,
      icon: L.divIcon({ className: 'me-host', html: '<div class="me-dot"></div>', iconSize: [0, 0] })
    }).addTo(map);
  }

  function pinHtml(s, st) {
    var test = isTest(s);
    var cls = test ? 'pin pin--blue is-test' : (st === 'green' ? 'pin pin--green is-live' : 'pin pin--red');
    var badge = test ? '<span class="pin-badge">' + esc(t('pin.test')) + '</span>' : '';
    return '<div class="pin-wrap"><div class="' + cls + '"><span>π</span></div>' +
      '<div class="pin-label">' + esc(storeName(s)) + badge + '</div></div>';
  }

  function renderPins() {
    if (!map || !pinLayer) { return; }
    pinLayer.clearLayers();
    state.stores.forEach(function (s) {
      var st = statusOf(s);
      if (st === 'hidden') { return; }
      if (!matchesFilter(s)) { return; }
      var marker = L.marker([s.lat, s.lng], {
        title: storeName(s), riseOnHover: true,
        icon: L.divIcon({ className: 'pin-host', html: pinHtml(s, st), iconSize: [0, 0] })
      });
      marker.on('click', function () { openStoreSheet(s.id); });
      pinLayer.addLayer(marker);
    });
  }

  function renderSummary() {
    var c = counts();
    var el = $('summary-text');
    if (!el) { return; }
    var hasNearby = false;
    state.stores.forEach(function (s) { if (distanceTo(s) < 20000) { hasNearby = true; } });
    if (!hasNearby && userLoc.source === 'gps') {
      el.textContent = t('map.noneHere');
      return;
    }
    el.textContent = t('map.summary', { open: c.green, red: c.red, test: c.test, hidden: c.hidden });
  }

  function renderDemoLabel() {
    var el = $('demo-label');
    if (!el) { return; }
    var label = t('demo.label') + ' · ';
    if (state.today === state.realToday) { label += t('demo.today') + ' ' + shortDate(state.today); }
    else { label += shortDate(state.today); }
    el.textContent = label;
  }

  function renderFallbackList() {
    var box = $('fallback-list');
    if (!box) { return; }
    var list = sortedStores(false).filter(matchesFilter);
    box.innerHTML = list.map(function (s) {
      var st = statusOf(s);
      var test = isTest(s);
      var dot = test ? 'dot--blue' : (st === 'green' ? 'dot--green' : 'dot--red');
      var tag = test ? '<span class="s-tag">' + esc(t('pin.test')) + '</span>' : '';
      var alt = storeNameAlt(s);
      return '<button class="fb-row" type="button" data-store="' + esc(s.id) + '">' +
        '<span class="dot ' + dot + '"></span>' +
        '<span class="name">' + esc(storeName(s)) + tag +
        (alt ? '<span class="fb-en">' + esc(alt) + '</span>' : '') + '</span>' +
        '<span class="meta" style="margin-left:auto">' + esc(distLabel(distanceTo(s))) + '</span></button>';
    }).join('');
  }

  function renderPinFilters() {
    var btns = document.querySelectorAll('#map-filters button');
    for (var i = 0; i < btns.length; i++) {
      if (btns[i].getAttribute('data-pin-filter') === state.pinFilter) { btns[i].classList.add('is-on'); }
      else { btns[i].classList.remove('is-on'); }
    }
  }

  function setPinFilter(f) {
    state.pinFilter = (f === 'green' || f === 'red' || f === 'test') ? f : 'all';
    renderPinFilters();
    renderPins();
    renderFallbackList();
  }

  /* ---------------------------------------------------- 위치 재탐색 */
  function setLocating(on) {
    var a = $('btn-locate'), b = $('btn-locate-top');
    if (a) { if (on) { a.classList.add('is-busy'); } else { a.classList.remove('is-busy'); } }
    if (b) { if (on) { b.classList.add('is-busy'); } else { b.classList.remove('is-busy'); } }
  }

  function locate(manual) {
    if (!navigator.geolocation) { onLocated(manual, false); return; }
    setLocating(true);
    navigator.geolocation.getCurrentPosition(function (pos) {
      userLoc = { lat: pos.coords.latitude, lng: pos.coords.longitude, source: 'gps' };
      onLocated(manual, true);
    }, function () {
      onLocated(manual, false);
    }, { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 });
  }

  function onLocated(manual, ok) {
    setLocating(false);
    if (!ok) {
      userLoc = { lat: DEFAULT_CENTER.lat, lng: DEFAULT_CENTER.lng, source: 'default' };
    }
    if (map) {
      map.setView([userLoc.lat, userLoc.lng], START_ZOOM);
      drawMe();
    }
    renderPins();
    renderSummary();
    renderFallbackList();
    if (manual) {
      toast(ok ? t('toast.located') : t('toast.locateFail'), ok ? 'good' : 'warn');
    }
  }

  /* ------------------------------------------------------- 점주 화면 */
  function renderMerchant() {
    var sel = $('my-store-select');
    if (!sel) { return; }
    var s = currentStore();
    if (!s) { return; }

    sel.innerHTML = state.stores.map(function (st) {
      return '<option value="' + esc(st.id) + '"' + (st.id === s.id ? ' selected' : '') + '>' + esc(storeName(st)) + '</option>';
    }).join('');

    var st = statusOf(s), off = lastCheckinOffset(s), streak = streakOf(s);
    var pill = $('my-store-status');
    pill.className = 'pill pill--' + st;
    pill.innerHTML = '<i></i>' + esc(t('status.' + st));

    var curMode = isTest(s) ? 'test' : 'live';
    var modeBtns = document.querySelectorAll('#mode-toggle button');
    for (var mi = 0; mi < modeBtns.length; mi++) {
      var btnMode = modeBtns[mi].getAttribute('data-mode');
      if (btnMode === curMode) { modeBtns[mi].classList.add('is-on'); }
      else { modeBtns[mi].classList.remove('is-on'); }
      if (btnMode === 'test') {
        if (curMode === 'test') { modeBtns[mi].classList.add('is-test'); }
        else { modeBtns[mi].classList.remove('is-test'); }
      }
    }

    $('hero-name').textContent = storeName(s);
    var heroEn = $('hero-name-en');
    if (heroEn) { heroEn.textContent = storeNameAlt(s); }
    var meta;
    if (st === 'green') { meta = t('merchant.metaGreen', { time: s.days[state.today] || '' }); }
    else if (off === null) { meta = t('merchant.never'); }
    else if (st === 'hidden') { meta = t('merchant.metaHidden', { n: off }); }
    else { meta = t(off === 1 ? 'merchant.metaRed1' : 'merchant.metaRed', { n: off }); }
    $('hero-meta').textContent = meta;
    var hs = $('hero-streak');
    if (streak > 0) { hs.style.display = ''; hs.textContent = t('merchant.streak', { n: streak }); }
    else { hs.style.display = 'none'; }

    var doneToday = !!s.days[state.today];
    var adDone = !!(s.adDays && s.adDays[state.today]);

    var b1 = $('btn-checkin');
    b1.disabled = doneToday;
    b1.innerHTML = ICON.check + '<span>' + esc(doneToday ? t('merchant.checkinDone') : t('merchant.checkin')) + '</span>';

    var b2 = $('btn-ad-checkin');
    b2.disabled = adDone;
    var label = adDone ? t('merchant.adDone') : (doneToday ? t('merchant.adBonus') : t('merchant.adCheckin'));
    b2.innerHTML = ICON.play + '<span>' + esc(label) + '</span>';

    renderWeek(s, streak);
  }

  function setStoreMode(m) {
    var s = currentStore();
    if (!s) { return; }
    var next = (m === 'test') ? 'test' : 'live';
    if ((isTest(s) ? 'test' : 'live') === next) { return; }
    s.mode = next;
    save();
    renderAll();
    toast(t(next === 'test' ? 'toast.modeTest' : 'toast.modeLive'), 'good');
  }

  function renderWeek(s, streak) {
    var strip = $('week-strip');
    if (!strip) { return; }
    var cells = [];
    for (var i = 6; i >= 0; i--) {
      var d = addDays(state.today, -i);
      var has = !!(s.days && s.days[d]);
      var isToday = (i === 0);
      cells.push('<div class="wday' + (isToday ? ' is-today' : '') + '">' +
        '<span class="wday-l">' + esc(weekdayShort(d)) + '</span>' +
        '<span class="wday-d' + (has ? ' on' : '') + '">' + (has ? '✓' : '·') + '</span>' +
        '<span class="wday-n">' + (+String(d).split('-')[2]) + '</span></div>');
    }
    strip.innerHTML = cells.join('');
    var ws = $('week-streak');
    if (ws) { ws.textContent = t('merchant.streak', { n: streak }); }
  }

  function doCheckin(withAd) {
    var s = currentStore();
    if (!s) { return; }
    var today = state.today;
    var done = !!s.days[today];
    var adDone = !!(s.adDays && s.adDays[today]);

    if (!withAd) {
      if (done) { toast(t('toast.already'), 'warn'); return; }
      s.days[today] = clockNow();
      addLog(PTS.basic, 'merchant', s, 'log.checkin');
      save();
      renderAll();
      toast(t('toast.checkin', { pts: PTS.basic }), 'good');
      return;
    }

    if (adDone) { toast(t('toast.adDone'), 'warn'); return; }

    if (done) {
      // 기본 체크인을 이미 했으면, 광고 보너스로 오늘 합계 2배(20P)를 맞춥니다.
      openAd(PTS.basic, function () {
        s.adDays = s.adDays || {};
        s.adDays[today] = true;
        addLog(PTS.basic, 'merchant', s, 'log.adBonus');
        save();
        renderAll();
        toast(t('toast.adBonus', { pts: PTS.basic }), 'good');
      });
      return;
    }

    openAd(PTS.ad, function () {
      s.days[today] = clockNow();
      s.adDays = s.adDays || {};
      s.adDays[today] = true;
      addLog(PTS.ad, 'merchant', s, 'log.adCheckin');
      save();
      renderAll();
      toast(t('toast.checkin', { pts: PTS.ad }), 'good');
    });
  }

  /* ------------------------------------------------------- 지갑 화면 */
  function renderWallet() {
    var total = $('points-total');
    if (!total) { return; }
    total.textContent = num(state.points);
    var m = 0, v = 0;
    state.logs.forEach(function (l) {
      if (l.role === 'merchant') { m += l.pts; }
      else if (l.role === 'visitor') { v += l.pts; }
    });
    $('pts-merchant').textContent = num(m) + ' P';
    $('pts-visitor').textContent = num(v) + ' P';
    $('log-count').textContent = t('wallet.logCount', { n: state.logs.length });

    var btns = document.querySelectorAll('#wallet-filters button');
    for (var i = 0; i < btns.length; i++) {
      var on = btns[i].getAttribute('data-filter') === state.filter;
      if (on) { btns[i].classList.add('is-on'); } else { btns[i].classList.remove('is-on'); }
    }
    renderLog();
  }

  /* --------------------------------------------------- Pi 로그인 (Pi Auth) */
  function renderPiAccount() {
    var st = $('pi-status');
    var btn = $('btn-pi-login');
    if (!st || !btn) { return; }
    if (state.piUser) {
      var name = state.piUser.username || state.piUser.uid || 'Pioneer';
      st.textContent = t('pi.signed', { name: name }) + (state.piUser.demo ? ' · ' + t('pi.demo') : '');
      btn.textContent = t('pi.signedBtn');
      btn.disabled = true;
    } else {
      st.textContent = t('pi.desc');
      btn.textContent = t('pi.signin');
      btn.disabled = false;
    }
  }

  /* Pi.authenticate(['username','payments']) — 파이 브라우저에서는 실제 인증,
     일반 브라우저에서는 데모 계정으로 같은 흐름을 보여줍니다. */
  function signInPi() {
    var st = $('pi-status');
    if (st) { st.textContent = t('pi.signing'); }
    PiBridge.authenticate().then(function (res) {
      var user = (res && res.user) || {};
      state.piUser = {
        uid: user.uid || 'demo-uid',
        username: user.username || 'pinow_pioneer',
        demo: (PiBridge.mode !== 'pi') || !!res.demo
      };
      save();
      renderPiAccount();
      toast(t('pi.done', { name: state.piUser.username }), 'good');
    }, function () {
      renderPiAccount();
      toast(t('pi.fail'), 'warn');
    });
  }

  function renderLog() {
    var box = $('wallet-log');
    if (!box) { return; }
    var items = state.logs.filter(function (l) {
      return state.filter === 'all' || l.role === state.filter;
    });
    if (!items.length) {
      box.innerHTML = '<div class="empty">' + esc(t('wallet.empty')) + '</div>';
      return;
    }
    box.innerHTML = items.map(function (l) {
      var s = l.storeId ? byId(l.storeId) : null;
      var title = t(l.key || 'log.checkin');
      var roleLabel = l.role === 'merchant' ? t('role.merchant') : (l.role === 'visitor' ? t('role.visitor') : '');
      var sub = (roleLabel ? roleLabel + ' · ' : '') + (s ? storeName(s) + ' · ' : '') + l.time;
      var icoCls = l.pts < 0 ? 'log-ico minus' : (l.role === 'visitor' ? 'log-ico visitor' : 'log-ico');
      var ico = l.pts < 0 ? '↗' : (l.role === 'visitor' ? ICON.user : ICON.store);

      if (k === name) { pages[k].classList.add('is-on'); } else { pages[k].classList.remove('is-on'); }
    });
    var btns = document.querySelectorAll('.tabbar button');
    for (var i = 0; i < btns.length; i++) {

      if (on) { btns[i].classList.add('is-on'); btns[i].setAttribute('aria-current', 'page'); }

    }

  /* ------------------------------------------------------- 광고 모달 */
  function openAd(pts, onReward) {
    var remain = AD_SECONDS;
    var body = '';
    body += '<div class="ad-box">';
    body += '<div class="ad-frame"><span class="ad-tag">AD</span><p>PiNow</p><small>' + esc(t('ad.sample')) + '</small></div>';
    body += '<div class="progress"><i id="ad-bar"></i></div>';
    body += '<div class="ad-count" id="ad-count">' + esc(t('ad.countdown', { n: remain })) + '</div>';
    body += '<p class="ad-note">' + esc(t('ad.note')) + '</p>';
    body += '</div>';
    var foot = '<button class="btn btn-ghost" type="button" id="ad-skip">' + esc(t('ad.skip')) + '</button>' +
      '<button class="btn btn-primary" type="button" id="ad-claim" disabled>' + esc(t('ad.claim', { pts: pts })) + '</button>';

    openModal(t('ad.title'), body, foot);

    $('ad-skip').onclick = closeModal;
    $('ad-claim').onclick = function () {
      if (remain > 0) { return; }
      closeModal();
      onReward();
    };

    // 파이 브라우저에서는 실제 Pi Ads도 함께 호출합니다 (실패해도 시연은 계속).
    if (PiBridge.isLive()) {
      try {
        var adPromise = PiBridge.showAd();
        if (adPromise && typeof adPromise.then === 'function') {
          adPromise.then(function () { }, function () { /* 광고 미충전 등은 무시 */ });
        }
      } catch (e) { /* SDK 미지원 버전은 시연만 */ }
    }

    if (adTimer) { clearInterval(adTimer); }
    adTimer = setInterval(function () {
      remain -= 1;
      var bar = $('ad-bar'), cnt = $('ad-count'), claim = $('ad-claim');
      if (!bar || !cnt) { clearInterval(adTimer); adTimer = null; return; }
      bar.style.width = Math.min(100, Math.round(((AD_SECONDS - remain) / AD_SECONDS) * 100)) + '%';
      if (remain <= 0) {
        clearInterval(adTimer);
        adTimer = null;
        cnt.textContent = t('ad.done');
        cnt.className = 'ad-count done';
        if (claim) { claim.disabled = false; }
      } else {
        cnt.textContent = t('ad.countdown', { n: remain });
      }
    }, 1000);
  }

  /* ------------------------------------------------------ 리뷰 모달 */
  function openReview(s) {
    var rating = 0;
    var stars = '';
    for (var i = 1; i <= 5; i++) {
      stars += '<button type="button" data-v="' + i + '" aria-label="' + i + '★">★</button>';
    }
    var body = '';
    body += '<div class="review-store">' + catEmoji(s.cat) + '<span>' + esc(t('review.q', { name: storeName(s) })) + '</span></div>';
    body += '<div class="field" style="margin-bottom:2px"><span>' + esc(t('review.rating')) + '</span></div>';
    body += '<div class="stars" id="star-row">' + stars + '</div>';
    body += '<label class="field"><span>' + esc(t('review.text')) + '</span>';
    body += '<textarea id="review-text" placeholder="' + esc(t('review.ph')) + '"></textarea></label>';
    var foot = '<button class="btn btn-ghost" type="button" id="rv-cancel">' + esc(t('common.cancel')) + '</button>' +
      '<button class="btn btn-primary" type="button" id="rv-submit">' + esc(t('review.submit')) + '</button>';

    openModal(t('review.title'), body, foot);

    var starEls = document.querySelectorAll('#star-row button');
    for (var j = 0; j < starEls.length; j++) {
      starEls[j].onclick = function () {
        rating = parseInt(this.getAttribute('data-v'), 10);
        for (var k = 0; k < starEls.length; k++) {
          if (parseInt(starEls[k].getAttribute('data-v'), 10) <= rating) { starEls[k].classList.add('on'); }
          else { starEls[k].classList.remove('on'); }
        }
      };
    }

    $('rv-cancel').onclick = closeModal;
    $('rv-submit').onclick = function () {
      if (!rating) { toast(t('toast.needRating'), 'warn'); return; }
      var note = ($('review-text') && $('review-text').value || '').trim();
      openAd(PTS.review, function () { awardReview(s, rating, note); });
    };
  }

  function awardReview(s, rating, note) {
    if (s.reviewDays && s.reviewDays[state.today]) { toast(t('toast.reviewed'), 'warn'); return; }
    s.reviewDays = s.reviewDays || {};
    s.reviewDays[state.today] = rating;
    s.lastReview = { rating: rating, note: note || '', date: state.today };
    addLog(PTS.review, 'visitor', s, 'log.review');
    save();
    renderAll();
    toast(t('toast.review', { pts: PTS.review }), 'good');
    if ($('sheet').classList.contains('is-on')) { openStoreSheet(s.id); }
  }

    var opts = storeItems(s).map(function (it) { return '<option>' + esc(it) + '</option>'; }).join('');

    body += '<div class="pay-head">' + catEmoji(s.cat) + '<b style="color:#344054">' + esc(storeName(s)) + '</b></div>';
    body += '<div style="font-size:11.5px;font-weight:700;color:#344054;margin-bottom:6px">' + esc(t('pay.amount')) + '</div>';
    body += '<div class="pay-amount"><input id="pay-amount" type="number" inputmode="decimal" min="0.1" step="0.1" value="1.5" aria-label="' + esc(t('pay.amount')) + '"><span>π</span></div>';
    body += '<label class="field"><span>' + esc(t('pay.item')) + '</span><select id="pay-item">' + opts + '</select></label>';
    body += '<label class="field"><span>' + esc(t('pay.memo')) + '</span><input id="pay-memo" type="text" value="' + esc(t('pay.demoMemo')) + '"></label>';

    body += '<li id="step-request"><i class="sdot"></i><span>' + esc(t('pay.step1')) + '</span></li>';

    body += '<li id="step-complete"><i class="sdot"></i><span>' + esc(t('pay.step3')) + '</span></li>';
    body += '</ul>';
    body += '<p class="ad-note">' + esc(t('pay.note')) + '</p>';
    var foot = '<button class="btn btn-ghost" type="button" id="pay-cancel">' + esc(t('common.cancel')) + '</button>' +
      '<button class="btn btn-primary" type="button" id="pay-run">' + esc(t('pay.submit')) + '</button>';

    openModal(t('pay.title'), body, foot);
    $('pay-cancel').onclick = closeModal;
    $('pay-run').onclick = function () { runPayment(s); };
  }

  function runPayment(s) {
    var amountEl = $('pay-amount');
    var amount = amountEl ? parseFloat(amountEl.value) : 1.5;
    if (!amount || amount <= 0) { amount = 1.5; }
    var memoEl = $('pay-memo');
    var memo = (memoEl && memoEl.value) ? memoEl.value : t('pay.demoMemo');
    var btn = $('pay-run');
    if (btn) { btn.disabled = true; btn.textContent = t('pay.step1'); }
    for (var i = 0; i < paySteps.length; i++) { setStep(paySteps[i], ''); }

    PiBridge.pay({ amount: amount, memo: memo, metadata: { storeId: s.id } }, function (step) {
      if (step === 'request') { setStep('request', 'run'); }
      if (step === 'approve') { setStep('request', 'ok'); setStep('approve', 'run'); }
      if (step === 'complete') { setStep('approve', 'ok'); setStep('complete', 'ok'); }
    }).then(function (res) {
      setStep('request', 'ok'); setStep('approve', 'ok'); setStep('complete', 'ok');
      var body = $('modal-body');
      var receipt = document.createElement('div');
      receipt.className = 'receipt';
      receipt.innerHTML = '<b>' + esc(t('pay.done')) + '</b>' + esc(amount.toFixed(2)) + ' π · ' + esc(storeName(s)) +
        '<br>' + esc(t('pay.tx')) + ': <code>' + esc(res.txid || res.paymentId || 'DEMO') + '</code>';
      if (body) { body.appendChild(receipt); }
      $('modal-foot').innerHTML = '<button class="btn btn-primary" type="button" id="pay-close">' + esc(t('common.close')) + '</button>';
      $('pay-close').onclick = closeModal;
    }).catch(function (err) {
      var msg = (err && String(err.message || '').indexOf('cancel') === 0) ? t('pay.cancel') : t('pay.error');
      toast(msg, 'warn');
      var running = document.querySelector('.steps li.run');
      if (running) { running.className = 'warn'; }
      if (btn) { btn.disabled = false; btn.textContent = t('pay.submit'); }
    });
  }
